publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2

  # Firebase
  firebase_core: ^2.28.0
  firebase_auth: ^4.17.2
  cloud_firestore: ^4.17.2

  # Local Storage & Networking
  shared_preferences: ^2.2.2
  http: ^1.1.0

  # UI & Utilities
  animations: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true